name: Build PGN Cleaner for Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PGN-Cleaner pgn_cleaner.py

      - name: Upload executable as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PGN-Cleaner-Windows
          path: dist/PGN-Cleaner.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish executable to GitHub Release when a version tag is pushed
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PGN-Cleaner.exe
          generate_release_notes: true
